<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniConverter Blog - Unit Conversion Guides & Articles</title>
  <meta name="description" content="Explore expert articles on unit conversions, measurement history, metric vs imperial comparisons, and client-side media optimization.">
  <link rel="canonical" href="https://temperatureconverter.org/blog.html">
  <link rel="author" type="text/plain" href="llms.txt">
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="OmniConverter Blog - Educational Guides & Tutorials">
  <meta property="og:description" content="Learn everything about temperature, weight, volume, distance, and file format conversions.">
  <meta property="og:url" content="https://temperatureconverter.org/blog.html">

  <link rel="stylesheet" href="styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "OmniConverter Blog",
    "description": "Guides and tutorials on unit conversions, science, and privacy-first digital tools.",
    "url": "https://temperatureconverter.org/blog.html"
  }
  </script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" aria-label="OmniConverter Home">
        <svg viewBox="0 0 24 24">
          <path d="M15 13V5a3 3 0 0 0-6 0v8a5 5 0 1 0 6 0zm-3-10a1 1 0 0 1 1 1v7h-2V4a1 1 0 0 1 1-1z"/>
        </svg>
        <span>OmniConverter</span>
      </a>

      <nav class="nav-tabs" aria-label="Main Navigation">
        <a href="index.html" class="tab-btn" style="text-decoration:none;">Tools</a>
        <a href="blog.html" class="tab-btn active" style="text-decoration:none;">Blog</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="content-section" style="margin-top: 1rem;">
      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">OmniConverter Blog & Guides</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem;">
        Discover in-depth explanations, mathematical formulas, conversion shortcuts, and privacy guides.
      </p>

      <div style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
        <input type="text" id="blogSearchInput" class="input-field" placeholder="Search blog articles..." style="max-width: 400px;">
      </div>
    </section>

    <!-- Blog Posts Grid -->
    <div id="blogGrid" class="quick-conversions-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
      <!-- Populated dynamically via JS -->
    </div>

    <!-- Article Reader View -->
    <div id="articleModal" class="content-section" style="display: none; margin-top: 2rem;">
      <button type="button" id="closeArticleBtn" class="btn-clear" style="margin-bottom: 1rem;">← Back to Articles</button>
      <div id="articleBody"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 OmniConverter Web Suite. All rights reserved. | <a href="privacy-policy.html" style="color:var(--primary-600);">Privacy Policy</a> | <a href="terms.html" style="color:var(--primary-600);">Terms</a> | <a href="about.html" style="color:var(--primary-600);">About</a> | <a href="contact.html" style="color:var(--primary-600);">Contact</a></p>
  </footer>

  <script type="module">
    import { posts } from './blog-data.js';

    document.addEventListener('DOMContentLoaded', () => {
      const blogGrid = document.getElementById('blogGrid');
      const articleModal = document.getElementById('articleModal');
      const articleBody = document.getElementById('articleBody');
      const closeArticleBtn = document.getElementById('closeArticleBtn');
      const blogSearchInput = document.getElementById('blogSearchInput');

      function renderPosts(filterText = '') {
        blogGrid.innerHTML = '';
        const filtered = posts.filter(p => 
          p.title.toLowerCase().includes(filterText.toLowerCase()) || 
          p.summary.toLowerCase().includes(filterText.toLowerCase()) ||
          p.category.toLowerCase().includes(filterText.toLowerCase())
        );

        if (filtered.length === 0) {
          blogGrid.innerHTML = '<p style="color:var(--text-muted);">No articles found matching your search.</p>';
          return;
        }

        filtered.forEach(post => {
          const card = document.createElement('article');
          card.className = 'content-section';
          card.style.margin = '0';
          card.style.cursor = 'pointer';
          card.style.transition = 'transform 0.2s, box-shadow 0.2s';
          card.innerHTML = `
            <span class="formula-badge" style="font-size:0.8rem; margin:0 0 0.5rem 0;">${post.category} • ${post.readTime}</span>
            <h2 style="font-size:1.25rem; margin-bottom:0.5rem; border:none; padding:0;">${post.title}</h2>
            <p style="font-size:0.95rem; color:var(--text-muted); margin-bottom:1rem;">${post.summary}</p>
            <span style="color:var(--primary-600); font-weight:600; font-size:0.9rem;">Read Article →</span>
          `;
          card.addEventListener('click', () => openArticle(post));
          blogGrid.appendChild(card);
        });
      }

      function openArticle(post) {
        blogGrid.style.display = 'none';
        articleModal.style.display = 'block';
        articleBody.innerHTML = `
          <span class="formula-badge" style="font-size:0.85rem;">${post.category} • Published ${post.date} • ${post.readTime}</span>
          <h1 style="font-size:2rem; font-weight:800; margin: 0.75rem 0 1rem 0;">${post.title}</h1>
          <div style="line-height:1.8; font-size:1.05rem;">
            ${post.content}
          </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      closeArticleBtn.addEventListener('click', () => {
        articleModal.style.display = 'none';
        blogGrid.style.display = 'grid';
      });

      blogSearchInput.addEventListener('input', (e) => {
        renderPosts(e.target.value);
      });

      renderPosts();
    });
  </script>
</body>
</html>
