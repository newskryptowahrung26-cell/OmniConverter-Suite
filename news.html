<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniConverter Newsroom - Latest Announcements & Updates</title>
  <meta name="description" content="Official newsroom for OmniConverter. Read press releases, product updates, and feature announcements.">
  <link rel="canonical" href="https://temperatureconverter.org/news.html">
  <link rel="alternate" type="application/rss+xml" title="OmniConverter News RSS Feed" href="feed.xml">
  <link rel="stylesheet" href="styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsMediaOrganization",
    "name": "OmniConverter Newsroom",
    "url": "https://temperatureconverter.org/news.html",
    "logo": "https://temperatureconverter.org/logo.png"
  }
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" aria-label="OmniConverter Home">
        <svg viewBox="0 0 24 24"><path d="M15 13V5a3 3 0 0 0-6 0v8a5 5 0 1 0 6 0zm-3-10a1 1 0 0 1 1 1v7h-2V4a1 1 0 0 1 1-1z"/></svg>
        <span>OmniConverter</span>
      </a>

      <nav class="nav-tabs">
        <a href="index.html" class="tab-btn" style="text-decoration:none;">Tools</a>
        <a href="news.html" class="tab-btn active" style="text-decoration:none;">News</a>
        <a href="blog.html" class="tab-btn" style="text-decoration:none;">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="content-section" style="margin-top:1rem;">
      <h1 style="font-size:2rem; font-weight:800; margin-bottom:0.5rem;">Newsroom & Product Announcements</h1>
      <p style="color:var(--text-muted); font-size:1.1rem;">Official press releases, product updates, and platform announcements.</p>
    </section>

    <div id="newsGrid" style="display:flex; flex-direction:column; gap:1.5rem;"></div>
  </main>

  <footer>
    <p>&copy; 2026 OmniConverter Web Suite. All rights reserved. | <a href="news.html" style="color:var(--primary-600);">Newsroom</a> | <a href="sitemap.html" style="color:var(--primary-600);">HTML Sitemap</a> | <a href="feed.xml" style="color:var(--primary-600);">RSS Feed</a></p>
  </footer>

  <script type="module">
    import { newsArticles } from './news-data.js';

    document.addEventListener('DOMContentLoaded', () => {
      const newsGrid = document.getElementById('newsGrid');
      newsArticles.forEach(item => {
        const card = document.createElement('article');
        card.className = 'content-section';
        card.innerHTML = `
          <span class="formula-badge" style="font-size:0.85rem;">${item.publicationName} • ${new Date(item.publicationDate).toLocaleDateString()}</span>
          <h2 style="font-size:1.5rem; margin:0.5rem 0 0.75rem 0;">${item.title}</h2>
          <div style="line-height:1.7; font-size:1.05rem; color:var(--text-muted);">${item.content}</div>
        `;
        newsGrid.appendChild(card);
      });
    });
  </script>
</body>
</html>
