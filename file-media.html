<body>
  <header>
    <div class="header-container">
      <a href="/" class="logo" aria-label="OmniConverter Home">
        <img src="logo.png" alt="OmniConverter Logo" style="width:32px; height:32px; border-radius:6px; object-fit:cover;">
        <span>OmniConverter</span>
      </a>

      <button type="button" class="mobile-menu-btn" onclick="const n=this.nextElementSibling||document.querySelector('.nav-tabs');if(n)n.classList.toggle('is-open');" aria-label="Toggle navigation menu">
        <span>Menu</span>

      </button>

      <nav class="nav-tabs" aria-label="Converter category navigation">
        <a href="/" class="tab-btn">Home</a>
        <a href="/temperature" class="tab-btn">Temperature</a>
        <a href="/weight-mass" class="tab-btn">Weight & Mass</a>

        <a href="/time-duration" class="tab-btn">Time & Duration</a>

        <a href="/file-media" class="tab-btn active">File & Media</a>
        <a href="/blog" class="tab-btn">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="contentFiles" class="tool-tab-content active">
      <section class="converter-card">
        <h1 class="converter-title">Client-Side Image Format Converter</h1>
        <div class="input-group" style="margin-bottom: 1rem;">
          <label for="imageFileInput">Select Image File (PNG, JPG, WebP, BMP)</label>
          <input type="file" id="imageFileInput" class="input-field" accept="image/*">
        </div>
        <div class="input-group" style="margin-bottom: 1.5rem;">
          <label for="targetImageFormat">Convert To Format</label>
          <select id="targetImageFormat" class="select-field">
            <option value="image/png">PNG (.png)</option>
            <option value="image/jpeg">JPEG (.jpg)</option>
            <option value="image/webp">WebP (.webp)</option>
            <option value="image/bmp">BMP (.bmp)</option>
          </select>
        </div>
        <button type="button" id="convertImageBtn" class="btn-convert">Convert Image</button>
        <div id="imageResultArea"></div>
      </section>

      <section class="converter-card">
        <h2 class="converter-title">Document & Data Format Converter</h2>
        <div class="input-group" style="margin-bottom: 1rem;">
          <label for="docInputText">Paste Content (JSON, CSV, or Text)</label>
          <textarea id="docInputText" class="input-field" style="height: 120px; font-family: monospace;" placeholder='[{"name":"John","age":30}]'></textarea>
        </div>
        <div class="input-group" style="margin-bottom: 1.5rem;">
          <label for="docConversionType">Select Conversion Mode</label>
          <select id="docConversionType" class="select-field">
            <option value="json2csv">JSON to CSV (.csv)</option>
            <option value="csv2json">CSV to JSON (.json)</option>
            <option value="txt2html">Plain Text to HTML (.html)</option>
          </select>
        </div>
        <button type="button" id="convertDocBtn" class="btn-convert">Convert Document</button>
        <div id="docResultArea"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
