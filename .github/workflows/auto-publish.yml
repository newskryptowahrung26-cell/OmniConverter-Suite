name: Gemini & Unsplash Auto-Publisher

on:
  # TEMPORARILY DISABLED IN BATCH 23N UNTIL INDEPENDENT APPROVAL OF P0 QUALITY GATES.
  # To re-enable after approval, uncomment the two lines below:
  # schedule:
  #   - cron: '0 0 * * *' # Daily 1 article every 24 hours (00:00 UTC)
  workflow_dispatch:

concurrency:
  group: auto-publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Uses GH_PAT if available (bypasses org-level token restrictions), else GITHUB_TOKEN
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/genai sharp

      - name: Run Auto-Publisher & Fail-Closed P0 Quality Gates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/vertex-publisher.js

      - name: Allowlisted Stage, Pre-Commit Guard & Push Changes
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Explicit allowlisted paths ONLY (never git add .)
          git add -- \
            blog/ es/blog/ de/blog/ pt/blog/ \
            assets/blog/ \
            blog.html es/blog.html de/blog.html pt/blog.html \
            blog-data.js es/blog-data.js de/blog-data.js pt/blog-data.js \
            sitemap.xml sitemap-en.xml sitemap-es.xml sitemap-de.xml sitemap-pt.xml \
            sitemap.html feed.xml news-sitemap.xml llms.txt

          # Fail-closed guard: abort if any forbidden path or temporary file is staged
          if git diff --cached --name-only | grep -E '(^audit_reports/|^\.sitemap-tx/|service-account\.json|\.env|\.pem$|\.key$|\.tmp$)'; then
            echo "FATAL: Forbidden path detected in staged index. Aborting commit."
            git reset
            exit 1
          fi

          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "Auto-published new article via Gemini API & Unsplash API"
          git push https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git HEAD:main
